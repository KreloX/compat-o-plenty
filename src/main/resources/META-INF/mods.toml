modLoader = "javafml"
loaderVersion = "$loader_version_range"
license = "$mod_license"
issueTrackerURL="$mod_github/issues"

[[mods]]
modId = "$mod_id"
version = "$mod_version"
displayName = "$mod_name"
updateJSONURL="$mod_github/raw/$mc_version/update.json"
displayURL = "$mod_url"
logoFile ="logo.png"
credits = "$mod_credits"
authors = "$mod_authors"
description = '''$mod_description'''

[[dependencies.$mod_id]]
    modId="forge"
    mandatory=true
    versionRange="$forge_version_range"
    ordering="NONE"
    side="BOTH"
[[dependencies.$mod_id]]
    modId="blueprint"
    mandatory=true
    versionRange="[$blueprint_version,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.$mod_id]]
    modId="biomesoplenty"
    mandatory=true
    versionRange="[$biomes_o_plenty_version,)"
    ordering="AFTER"
    side="BOTH"
